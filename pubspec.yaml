name: aman_player
description: Local-first secure Flutter video player inspired by MX Player and VLC.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  photo_manager: ^3.12.0
  shared_preferences: ^2.5.5
  screen_brightness: ^2.1.11
  path_provider: ^2.1.6
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

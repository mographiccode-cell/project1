name: Publish Aman Player Source

on:
  push:
    branches:
      - main
    paths:
      - '.source_parts/**'
      - '.github/workflows/publish-source.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test -d .source_parts || exit 0
          cat .source_parts/part*.b64 | base64 --decode > /tmp/AmanPlayer-v0.3.0-source.tar.xz
          echo "36f1fd7ec4184b67e9a6cd813746547d7be65299de066eacd58e000b5443a3d7  /tmp/AmanPlayer-v0.3.0-source.tar.xz" | sha256sum -c -

      - name: Expand Flutter source
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/AmanPlayer-v0.3.0-source.tar.xz -C .
          mkdir -p releases
          cp /tmp/AmanPlayer-v0.3.0-source.tar.xz releases/AmanPlayer-v0.3.0-source.tar.xz
          rm -rf .source_parts
          rm -f .github/workflows/publish-source.yml

      - name: Commit published source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "release: publish Aman Player v0.3.0 Flutter source"
          git push
